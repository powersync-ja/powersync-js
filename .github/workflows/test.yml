# Ensures packages test correctly
name: Test Packages

on:
  push:

jobs:
  test:
    name: Test Packages
    runs-on: ubuntu-xl
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Enable Corepack
        run: corepack enable
      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: '.nvmrc'
          cache: pnpm

      - name: Install dependencies
        run: pnpm install

      - name: Configure Playwright
        run: |
          pnpm exec playwright install-deps
          pnpm exec playwright install

      - name: Build
        run: pnpm build:packages

      - name: Test
        run: pnpm test

      # Also test oldest Node version we still support (we support everything that isn't EOL).
      - name: Setup Node.js 22
        uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Rebuild native modules for Node.js 22
        run: pnpm --recursive rebuild better-sqlite3

      - name: Test (Node.js 22)
        run: |
          node --version
          pnpm --filter @powersync/common --filter @powersync/shared-internals --filter @powersync/node test
