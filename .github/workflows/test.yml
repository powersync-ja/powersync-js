# Ensures packages test correctly
name: Test Packages

on:
  push:
  pull_request:

concurrency:
  group: test-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  zizmor:
    runs-on: ubuntu-slim
    if: github.event_name == 'push' || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository)
    permissions:
      security-events: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Run zizmor 🌈
        uses: zizmorcore/zizmor-action@53290badfa369cb0bf7ad16342cb62c2fa47ac7b # v0.8.0

  test:
    name: Test Packages
    if: github.event_name == 'push' || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository)
    runs-on: ubuntu-xl
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Enable Corepack
        run: corepack enable
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'
          cache: pnpm

      - name: Install dependencies
        run: pnpm install

      - name: Configure Playwright
        run: |
          pnpm exec playwright install-deps
          pnpm exec playwright install

      - name: Build
        run: pnpm build:packages

      - name: Test
        run: pnpm test

      # Also test oldest Node version we still support (we support everything that isn't EOL).
      - name: Setup Node.js 22
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Rebuild native modules for Node.js 22
        run: pnpm --recursive rebuild better-sqlite3

      - name: Test (Node.js 22)
        run: |
          node --version
          pnpm --filter @powersync/common --filter @powersync/shared-internals --filter @powersync/node test
