# Ensures packages and demos test correctly
name: Test Isolated Demos

on:
  push:
  pull_request:

concurrency:
  group: demos-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: Test Isolated Demos
    if: github.event_name == 'push' || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Enable Corepack
        run: corepack enable
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'
          cache: pnpm

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          java-version: "21"
          distribution: "temurin"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1

      - name: Install
        run: pnpm install

      - name: Build Packages
        run: pnpm build:packages

      - name: Test Package Exports
        run: pnpm test:packages:exports

      - name: Start Verdaccio
        run: |
          npm install -g verdaccio
          nohup verdaccio -c verdaccio-config.yaml &
          sleep 10 # Give Verdaccio some time to start

      - name: Prepare For Test Publish
        run: npx tsx scripts/test-publish-helper.ts

      - name: Registry login
        run: npx npm-cli-login -u test -p test -e test@example.com -r http://localhost:4873

      - name: Config Temporary Registry
        run: echo "@powersync:registry=http://localhost:4873" >> ~/.npmrc

      # No actual auth is ever supplied to this action.
      # It should never be able to publish to NPMJS
      - name: Test publish
        run: pnpm -r publish --no-git-checks # zizmor: ignore[use-trusted-publishing] publishes to local verdaccio

      - name: Test Demos
        run: npx tsx scripts/isolated-demo-test.ts
