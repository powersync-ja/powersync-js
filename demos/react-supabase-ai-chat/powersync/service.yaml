# yaml-language-server: $schema=https://unpkg.com/@powersync/cli-schemas@latest/json-schema/service-config.json
_type: self-hosted

# Local Supabase Postgres is both the replication source and the bucket storage.
# The connection strings are set in docker/.env.
replication:
  connections:
    - type: postgresql
      uri: !env PS_DATA_SOURCE_URI
      sslmode: disable

storage:
  type: postgresql
  uri: !env PS_STORAGE_SOURCE_URI
  sslmode: disable

sync_config:
  path: ./sync-config.yaml

port: 8080

# Verify Supabase Auth JWTs (including anonymous sessions) using the local Supabase JWKS.
client_auth:
  jwks_uri: http://host.docker.internal:54321/auth/v1/.well-known/jwks.json
  audience:
    - authenticated

telemetry:
  prometheus_port: 9090
  disable_telemetry_sharing: true

api:
  tokens:
    - dev-token-do-not-use-in-production
